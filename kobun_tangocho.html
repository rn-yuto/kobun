<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>古文単語帳ゲーム</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap');
:root{
  --bg:#120a0a;--surface:#1e1212;--surface2:#2e1a1a;
  --accent:#dc2626;--accent2:#f43f5e;--accent3:#f97316;
  --gold:#f59e0b;--green:#10b981;--red:#ef4444;
  --text:#e2e8f0;--text2:#a89494;--border:#4a2d2d;--glow:rgba(220,38,38,0.4)
}
.player-btn{width:100%;border:none;border-radius:16px;padding:18px;font-size:1.1rem;font-weight:700;color:white;cursor:pointer;transition:all 0.2s;font-family:'Noto Sans JP',sans-serif}
.player-btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
#app{position:relative;z-index:1;min-height:100vh}
.screen{display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:flex-start;padding:20px}
.screen.active{display:flex}
.home-logo{font-family:'Space Grotesk',sans-serif;font-size:clamp(1.6rem,7vw,3rem);font-weight:700;background:linear-gradient(135deg,var(--accent2),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center;margin:24px 0 6px}
.home-sub{font-size:clamp(0.75rem,3vw,0.95rem);color:var(--text2);text-align:center;margin-bottom:28px;letter-spacing:0.08em}
.deck-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;width:100%;max-width:680px;margin-bottom:20px}
.deck-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:22px 18px;cursor:pointer;transition:all .25s;text-align:left}
.deck-card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 8px 32px var(--glow)}
.deck-name{font-family:'Space Grotesk',sans-serif;font-size:1.15rem;font-weight:700;margin-bottom:4px}
.deck-meta{font-size:.78rem;color:var(--text2)}
.deck-pct{font-size:.72rem;color:var(--accent3);margin-top:6px}
.user-row{display:flex;gap:8px;align-items:center;width:100%;max-width:420px;margin-bottom:6px}
.user-input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 14px;font-size:.92rem;color:var(--text);outline:none;font-family:'Noto Sans JP',sans-serif}
.user-input:focus{border-color:var(--accent)}
.btn-primary{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:14px;padding:15px;font-size:.95rem;font-weight:600;color:#fff;cursor:pointer;transition:all .2s;font-family:'Noto Sans JP',sans-serif;letter-spacing:.05em}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px var(--glow)}
.btn-back{background:transparent;border:1px solid var(--border);border-radius:10px;padding:9px 18px;font-size:.86rem;color:var(--text2);cursor:pointer;transition:all .2s;margin-top:14px;font-family:'Noto Sans JP',sans-serif}
.btn-back:hover{border-color:var(--text2);color:var(--text)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:26px 22px;width:100%;max-width:520px}
.panel-title{font-family:'Space Grotesk',sans-serif;font-size:1.1rem;font-weight:600;text-align:center;margin-bottom:16px}
.cat-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.cat-chip{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 14px;font-size:.82rem;color:var(--text2);cursor:pointer;transition:all .15s;user-select:none}
.cat-chip.on{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:var(--accent);color:#fff}
.quick-row{display:flex;gap:8px;margin-bottom:16px}
.quick-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:.78rem;color:var(--text2);cursor:pointer}
.quick-btn:hover{border-color:var(--accent);color:var(--accent2)}
.range-info{font-size:.82rem;color:var(--text2);text-align:center;margin-bottom:14px}
.game-header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(10,10,18,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);z-index:100}
.word-num{font-family:'Space Grotesk',sans-serif;font-size:.9rem;font-weight:600;color:var(--accent3)}
.progress-mini{font-size:.72rem;color:var(--text2)}
.score-display{font-family:'Space Grotesk',sans-serif;font-size:.9rem;font-weight:600;color:var(--gold);text-align:right}
.score-label{font-size:.62rem;color:var(--text2)}
.game-body{padding-top:78px;padding-bottom:40px;width:100%;max-width:600px;margin:0 auto;display:flex;flex-direction:column;align-items:center}
.progress-bar-wrap{width:100%;height:4px;background:var(--surface2);border-radius:2px;margin-bottom:18px}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent3));border-radius:2px;transition:width .3s}
.question-card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:32px 24px;width:100%;text-align:center;margin-bottom:18px;position:relative;overflow:hidden}
.question-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent3))}
.question-label{font-size:.72rem;color:var(--text2);letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px}
.question-cat{font-size:.72rem;color:var(--accent3);margin-bottom:12px}
.question-word{font-family:'Noto Sans JP',sans-serif;font-size:clamp(1.6rem,7vw,2.6rem);font-weight:700;color:var(--text);line-height:1.3}
.answer-boxes{width:100%;margin-bottom:16px;display:flex;flex-direction:column;gap:10px}
.answer-box{background:var(--surface2);border:2px dashed var(--border);border-radius:14px;padding:14px 16px;text-align:left;transition:all .2s}
.answer-box.revealed{border-style:solid;border-color:var(--accent3);background:var(--surface)}
.answer-box-num{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--accent2);margin-right:6px}
.answer-box-body{display:inline;color:var(--text2)}
.answer-box.revealed .answer-box-body{color:var(--text)}
.answer-box-line{display:block;line-height:1.6}
.reveal-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:16px;padding:17px 28px;font-size:.95rem;font-weight:600;color:#fff;cursor:pointer;transition:all .2s;width:100%;max-width:320px;font-family:'Noto Sans JP',sans-serif;margin-bottom:10px;box-shadow:0 4px 20px var(--glow)}
.reveal-btn:hover{transform:translateY(-2px)}
.judge-btns{display:flex;gap:10px;width:100%;display:none}
.judge-btns.visible{display:flex}
.btn-correct{flex:1;background:linear-gradient(135deg,#059669,var(--green));border:none;border-radius:14px;padding:14px;font-size:.9rem;font-weight:700;color:#fff;cursor:pointer}
.btn-incorrect{flex:1;background:linear-gradient(135deg,#dc2626,var(--red));border:none;border-radius:14px;padding:14px;font-size:.9rem;font-weight:700;color:#fff;cursor:pointer}
.btn-correct:hover,.btn-incorrect:hover{transform:translateY(-2px)}
.next-hint{font-size:.76rem;color:var(--text2);text-align:center;margin-top:8px}
.results-card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:32px 24px;width:100%;max-width:480px;text-align:center;margin-top:20px}
.results-title{font-family:'Space Grotesk',sans-serif;font-size:1.4rem;font-weight:700;margin-bottom:6px;background:linear-gradient(135deg,var(--accent2),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.results-score-big{font-family:'Space Grotesk',sans-serif;font-size:3rem;font-weight:900;color:var(--gold);margin:14px 0}
.results-detail{font-size:.86rem;color:var(--text2);margin-bottom:12px;line-height:2}
.results-detail span{color:var(--text);font-weight:600}
.save-indicator{font-size:.72rem;color:var(--text2);text-align:center;margin-top:6px}
.wrong-list{background:var(--surface2);border:1px solid var(--border);border-radius:16px;padding:14px;width:100%;max-width:480px;margin-top:14px;max-height:220px;overflow-y:auto}
.wrong-list-title{font-size:.78rem;color:var(--text2);margin-bottom:8px;text-align:center;font-weight:600}
.wrong-item{padding:8px 2px;border-bottom:1px solid var(--border);font-size:.82rem}
.wrong-item:last-child{border-bottom:none}
.wrong-word{font-weight:700;color:var(--accent2)}
.wrong-mean{color:var(--text2);font-size:.78rem;margin-top:2px}
.loader{font-size:.9rem;color:var(--text2);margin-top:60px;text-align:center}
</style>
</head>
<body>
<div id="app">

<!-- USER SELECT -->
<div class="screen active" id="screenUserSelect">
  <div class="home-logo">WELCOME</div>
  <div class="home-sub">プレイヤーを選んでください</div>
  <div style="display:flex;flex-direction:column;gap:14px;width:100%;max-width:280px">
    <button class="player-btn" style="background:linear-gradient(135deg,#dc2626,#f43f5e)" onclick="selectUser('YUTO')">🧑 YUTO</button>
    <button class="player-btn" style="background:linear-gradient(135deg,#f43f5e,#f97316)" onclick="selectUser('KANON')">👩 KANON</button>
    <button class="player-btn" style="background:linear-gradient(135deg,#475569,#334155)" onclick="selectUser('GUEST')">👤 ゲストモード</button>
  </div>
  <div style="font-size:0.72rem;color:var(--text2);margin-top:14px;text-align:center">ゲストモードは正答率を記録しません</div>
</div>

<!-- HOME: deck select -->
<div class="screen" id="screenHome">
  <div class="home-logo">古文単語帳</div>
  <div class="home-sub">単語帳ゲーム</div>
  <div id="homePlayerBadge" style="margin-bottom:18px;font-size:0.88rem;color:var(--text2)">プレイヤー: -</div>
  <div id="deckLoading" class="loader">単語帳を読み込み中...</div>
  <div class="deck-grid" id="deckGrid" style="display:none"></div>
  <button class="btn-back" onclick="showScreen('screenUserSelect')">← プレイヤー選択へ</button>
</div>

<!-- RANGE / CATEGORY SELECT -->
<div class="screen" id="screenRange">
  <div class="panel">
    <div class="panel-title" id="rangeTitle">出題範囲を選択</div>
    <div class="quick-row">
      <button class="quick-btn" onclick="selectAllCats(true)">すべて選択</button>
      <button class="quick-btn" onclick="selectAllCats(false)">すべて解除</button>
    </div>
    <div class="cat-list" id="catList"></div>
    <div class="range-info" id="rangeInfo"></div>
    <button class="btn-primary" onclick="startGame()">ゲーム開始！</button><br>
    <button class="btn-back" onclick="showScreen('screenHome')">← 単語帳選択へ戻る</button>
  </div>
</div>

<!-- GAME -->
<div class="screen" id="screenGame">
  <div class="game-header">
    <div>
      <div class="word-num" id="g_wordNum">#1</div>
      <div class="progress-mini" id="g_progress">1 / 10</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px">
      <button class="btn-back" style="padding:5px 10px;font-size:.72rem;margin:0" onclick="endGame()">終了</button>
      <div class="score-label">正答率</div>
      <div class="score-display" id="g_score">-</div>
    </div>
  </div>
  <div class="game-body">
    <div class="progress-bar-wrap"><div class="progress-bar" id="g_progressBar" style="width:0%"></div></div>
    <div class="question-card">
      <div class="question-label">次の古文単語の意味は？</div>
      <div class="question-cat" id="g_cat"></div>
      <div class="question-word" id="g_word"></div>
    </div>
    <div class="answer-boxes" id="g_answerBoxes"></div>
    <button class="reveal-btn" id="g_revealBtn" onclick="revealAnswer()">💡 解答を確認する</button>
    <div class="judge-btns" id="g_judgeBtns">
      <button class="btn-correct" onclick="judge(true)">⭕ 正解だった</button>
      <button class="btn-incorrect" onclick="judge(false)">✕ 不正解だった</button>
    </div>
    <div class="next-hint" id="g_nextHint" style="display:none">タップ / スペースキーで次へ</div>
  </div>
</div>

<!-- RESULTS -->
<div class="screen" id="screenResults">
  <div class="results-card">
    <div class="results-title">🏆 結果発表</div>
    <div class="results-score-big" id="r_pct">--</div>
    <div class="results-detail" id="r_detail"></div>
    <div class="save-indicator" id="r_saveStatus"></div>
  </div>
  <div id="wrongListSection" style="display:none;width:100%;max-width:480px">
    <div class="wrong-list">
      <div class="wrong-list-title">❌ 間違えた単語</div>
      <div id="wrongListBody"></div>
    </div>
  </div>
  <div style="display:flex;gap:8px;margin-top:14px;width:100%;max-width:480px;flex-wrap:wrap">
    <button class="btn-primary" style="flex:1;min-width:100px" onclick="retryGame()">もう一度</button>
    <button class="btn-back" style="flex:1;min-width:100px;margin:0" onclick="showScreen('screenHome')">単語帳選択へ</button>
  </div>
</div>

</div><!-- #app -->

<script>
// ===================================================================
// 設定
// ===================================================================
// 単語帳CSVを置くフォルダ（このHTMLファイルからの相対パス）
const WORDS_DIR = 'words';
// GitHub Pages で自動デッキ検出を使う場合は owner/repo を設定（未設定なら manifest.json を使用）
const GH_OWNER = '';   // 例: 'yourname'
const GH_REPO  = '';   // 例: 'kobun-tango'
const GH_BRANCH = 'main';
// スプレッドシート連携用 GAS Web アプリ URL（Gemini に作成してもらったら差し替える）
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwgTCJRcKbTXNq91Am6m_P2YVvX2vK7qnny-O3zZEmRj_k9taklQquULdMRuLpKOchR/exec';

// ===================================================================
// 状態
// ===================================================================
let DECKS = [];           // [{name, file}]
let currentDeck = null;   // {name, file, words:[...]}
let currentUser = '';
let selectedCats = new Set();
let queue = [];
let qIndex = 0;
let correctCount = 0;
let wrongList = [];
let revealed = false;
let deckStats = {};       // {id: {correct,total}} for currentUser+currentDeck (from GAS)

// ===================================================================
// 起動
// ===================================================================
let deckListLoaded = false;
let userStats = {}; // {deckName: {wordId: {correct,total}}} キャッシュ（GUESTは常に空）

function statKey() { return currentUser === 'GUEST' ? null : 'kobun_word_stats_' + currentUser; }
function loadUserStatsLocal() {
  const k = statKey(); if (!k) { userStats = {}; return; }
  try { userStats = JSON.parse(localStorage.getItem(k) || '{}'); } catch(e) { userStats = {}; }
}
function saveUserStatsLocal() {
  const k = statKey(); if (!k) return;
  localStorage.setItem(k, JSON.stringify(userStats));
}
function updateLocalWordStat(id, isCorrect) {
  if (currentUser === 'GUEST') return;
  if (!userStats[currentDeck.name]) userStats[currentDeck.name] = {};
  const bucket = userStats[currentDeck.name];
  if (!bucket[id]) bucket[id] = { correct: 0, total: 0 };
  bucket[id].total++;
  if (isCorrect) bucket[id].correct++;
  saveUserStatsLocal();
}

function selectUser(user) {
  currentUser = user;
  loadUserStatsLocal();
  if (user === 'GUEST') {
    document.getElementById('homePlayerBadge').textContent = 'プレイヤー: GUEST';
    showScreen('screenHome');
    if (!deckListLoaded) { deckListLoaded = true; loadDeckList(); }
    return;
  }
  if (!GAS_URL || GAS_URL.startsWith('REPLACE')) {
    document.getElementById('homePlayerBadge').textContent = 'プレイヤー: ' + user + '（オフライン）';
    showScreen('screenHome');
    if (!deckListLoaded) { deckListLoaded = true; loadDeckList(); }
    return;
  }
  document.getElementById('homePlayerBadge').textContent = 'プレイヤー: ' + user + '（同期中...）';
  showScreen('screenHome');
  if (!deckListLoaded) { deckListLoaded = true; loadDeckList(); }
  fetch(GAS_URL + '?user=' + encodeURIComponent(user))
    .then(r => r.json())
    .then(data => {
      if (!data.error) {
        userStats = data.stats || {};
        saveUserStatsLocal();
      }
      document.getElementById('homePlayerBadge').textContent = 'プレイヤー: ' + user + '（オンライン）';
    })
    .catch(() => {
      document.getElementById('homePlayerBadge').textContent = 'プレイヤー: ' + user + '（オフライン）';
    });
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

// ===================================================================
// デッキ一覧の自動検出
// 優先順: 1) GitHub API でwords/フォルダの中身を取得（owner/repo設定時）
//         2) words/manifest.json を読む
//         3) 失敗時はエラー表示
// ===================================================================
async function loadDeckList() {
  let files = null;
  if (GH_OWNER && GH_REPO) {
    try {
      const r = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${WORDS_DIR}?ref=${GH_BRANCH}`);
      if (r.ok) {
        const list = await r.json();
        files = list.filter(f => f.name.toLowerCase().endsWith('.csv')).map(f => f.name);
      }
    } catch (e) { /* fallthrough to manifest */ }
  }
  if (!files) {
    try {
      const r = await fetch(WORDS_DIR + '/manifest.json');
      if (r.ok) files = await r.json();
    } catch (e) { /* ignore */ }
  }
  if (!files || !files.length) {
    document.getElementById('deckLoading').textContent =
      '単語帳が見つかりません。words/manifest.json に CSV ファイル名の一覧を用意するか、GH_OWNER/GH_REPO を設定してください。';
    return;
  }
  DECKS = files.map(f => ({ file: f, name: f.replace(/\.csv$/i, '') }));
  document.getElementById('deckLoading').style.display = 'none';
  const grid = document.getElementById('deckGrid');
  grid.style.display = 'grid';
  grid.innerHTML = DECKS.map((d, i) =>
    `<div class="deck-card" onclick="selectDeck(${i})">
       <div class="deck-name">📖 ${escapeHtml(d.name)}</div>
       <div class="deck-meta" id="deckMeta_${i}">読み込み待機中...</div>
     </div>`
  ).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ===================================================================
// CSVパース
// フォーマット: 分類,ID,単語,意味（"①〜。②〜。" 形式）
// ===================================================================
function parseCSV(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim().length);
  return lines.map(line => {
    const cols = splitCSVLine(line);
    return { category: cols[0] || '', id: cols[1] || '', word: cols[2] || '', meaningRaw: cols[3] || '' };
  });
}
// 簡易CSV分割（ダブルクォート囲みに対応）
function splitCSVLine(line) {
  const out = []; let cur = ''; let inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQ) {
      if (c === '"' && line[i+1] === '"') { cur += '"'; i++; }
      else if (c === '"') { inQ = false; }
      else cur += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { out.push(cur); cur = ''; }
      else cur += c;
    }
  }
  out.push(cur);
  return out.map(s => s.trim());
}

// "①歩く。 ②あちこちで〜する。" → [{num:'①', lines:['歩く']}, {num:'②', lines:['あちこちで〜する']}]
const CIRCLE_NUMS = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
function parseMeaning(raw) {
  const blocks = [];
  // ①などで分割
  const re = /([①②③④⑤⑥⑦⑧⑨⑩])/g;
  const parts = raw.split(re).filter(p => p.length);
  let i = 0;
  if (parts.length && !CIRCLE_NUMS.includes(parts[0])) {
    // 番号が付いていない場合は①として扱う
    blocks.push({ num: '①', lines: splitSentences(parts[0]) });
    i = 1;
  }
  for (; i < parts.length; i += 2) {
    const num = parts[i];
    const body = parts[i+1] || '';
    blocks.push({ num, lines: splitSentences(body) });
  }
  if (!blocks.length) blocks.push({ num: '①', lines: splitSentences(raw) });
  return blocks;
}
function splitSentences(s) {
  return s.split('。').map(x => x.trim()).filter(x => x.length);
}

// ===================================================================
// デッキ選択 → 読み込み
// ===================================================================
async function selectDeck(i) {
  const d = DECKS[i];
  try {
    const r = await fetch(WORDS_DIR + '/' + d.file);
    const text = await r.text();
    const rows = parseCSV(text);
    const words = rows.map(row => ({
      id: row.id,
      category: row.category,
      word: row.word,
      meaning: parseMeaning(row.meaningRaw)
    }));
    currentDeck = { name: d.name, file: d.file, words };
  } catch (e) {
    alert('単語帳の読み込みに失敗しました: ' + d.file);
    return;
  }
  await loadDeckStats();
  const cats = [...new Set(currentDeck.words.map(w => w.category))];
  selectedCats = new Set(cats);
  document.getElementById('rangeTitle').textContent = currentDeck.name + '：出題範囲を選択';
  document.getElementById('catList').innerHTML = cats.map(c =>
    `<div class="cat-chip on" data-cat="${escapeHtml(c)}" onclick="toggleCat(this)">${escapeHtml(c)}</div>`
  ).join('');
  updateRangeInfo();
  showScreen('screenRange');
}

function toggleCat(el) {
  const c = el.dataset.cat;
  if (selectedCats.has(c)) { selectedCats.delete(c); el.classList.remove('on'); }
  else { selectedCats.add(c); el.classList.add('on'); }
  updateRangeInfo();
}
function selectAllCats(on) {
  const cats = [...new Set(currentDeck.words.map(w => w.category))];
  selectedCats = on ? new Set(cats) : new Set();
  document.querySelectorAll('.cat-chip').forEach(el => el.classList.toggle('on', on));
  updateRangeInfo();
}
function updateRangeInfo() {
  const n = currentDeck.words.filter(w => selectedCats.has(w.category)).length;
  document.getElementById('rangeInfo').textContent = `出題対象: ${n} 語`;
}

// ===================================================================
// スプレッドシートから正答率取得（任意・GAS未設定時はスキップ）
// ===================================================================
function loadDeckStats() {
  deckStats = (userStats[currentDeck.name]) || {};
}

// ===================================================================
// ゲーム本体
// ===================================================================
function startGame() {
  const pool = currentDeck.words.filter(w => selectedCats.has(w.category));
  if (!pool.length) { alert('出題範囲を1つ以上選択してください'); return; }
  queue = shuffle(pool);
  qIndex = 0; correctCount = 0; wrongList = [];
  showScreen('screenGame');
  renderQuestion();
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function renderQuestion() {
  revealed = false;
  const w = queue[qIndex];
  document.getElementById('g_wordNum').textContent = '#' + (qIndex+1);
  document.getElementById('g_progress').textContent = (qIndex+1) + ' / ' + queue.length;
  document.getElementById('g_progressBar').style.width = (qIndex/queue.length*100) + '%';
  document.getElementById('g_score').textContent = qIndex === 0 ? '-' : Math.round(correctCount/qIndex*100) + '%';
  document.getElementById('g_cat').textContent = w.category;
  document.getElementById('g_word').textContent = w.word;
  document.getElementById('g_answerBoxes').innerHTML = w.meaning.map(b =>
    `<div class="answer-box"><span class="answer-box-num">${b.num}</span><span class="answer-box-body">???</span></div>`
  ).join('');
  document.getElementById('g_revealBtn').style.display = 'block';
  document.getElementById('g_judgeBtns').classList.remove('visible');
  document.getElementById('g_nextHint').style.display = 'none';
}
function revealAnswer() {
  if (revealed) return;
  revealed = true;
  const w = queue[qIndex];
  const boxes = document.querySelectorAll('#g_answerBoxes .answer-box');
  w.meaning.forEach((b, i) => {
    boxes[i].classList.add('revealed');
    boxes[i].querySelector('.answer-box-body').innerHTML =
      b.lines.map(l => `<span class="answer-box-line">${escapeHtml(l)}。</span>`).join('');
  });
  document.getElementById('g_revealBtn').style.display = 'none';
  document.getElementById('g_judgeBtns').classList.add('visible');
}
function judge(isCorrect) {
  const w = queue[qIndex];
  if (isCorrect) correctCount++;
  else wrongList.push(w);
  updateLocalWordStat(w.id, isCorrect);
  document.getElementById('g_judgeBtns').classList.remove('visible');
  document.getElementById('g_nextHint').style.display = 'block';
  setTimeout(() => {
    qIndex++;
    if (qIndex >= queue.length) endGame();
    else renderQuestion();
  }, 350);
}
function endGame() {
  const total = qIndex;
  const pct = total ? Math.round(correctCount/total*100) : 0;
  document.getElementById('r_pct').textContent = pct + '%';
  document.getElementById('r_detail').innerHTML =
    `<span>${correctCount}</span> / <span>${total}</span> 問正解`;
  const wlSec = document.getElementById('wrongListSection');
  if (wrongList.length) {
    wlSec.style.display = 'block';
    document.getElementById('wrongListBody').innerHTML = wrongList.map(w =>
      `<div class="wrong-item"><div class="wrong-word">${escapeHtml(w.word)}</div>
       <div class="wrong-mean">${escapeHtml(w.meaning.map(b => b.num + b.lines.join('。')).join(' '))}</div></div>`
    ).join('');
  } else { wlSec.style.display = 'none'; }
  showScreen('screenResults');
  saveResults(total);
}

// キーボード/タップで次へ（正解/不正解ボタン表示中を除く）
document.addEventListener('keydown', e => {
  if (e.code !== 'Space') return;
  const gameScreen = document.getElementById('screenGame');
  if (!gameScreen.classList.contains('active')) return;
  e.preventDefault();
  if (!revealed) revealAnswer();
});

function retryGame() { startGame(); }

// ===================================================================
// スプレッドシートへ結果送信（GAS）
// ===================================================================
function saveResults(total) {
  const el = document.getElementById('r_saveStatus');
  if (currentUser === 'GUEST' || !currentUser) {
    el.textContent = 'ゲストモード（クラウド保存なし）';
    return;
  }
  if (!GAS_URL || GAS_URL.startsWith('REPLACE')) {
    el.textContent = '※ スプレッドシート連携が未設定です';
    return;
  }
  const now = new Date();
  const dateStr = now.getFullYear()+'/'+(now.getMonth()+1)+'/'+now.getDate()+' '+
    now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  const words = queue.slice(0, total).map(w => ({ id: w.id, word: w.word, correct: !wrongList.includes(w) }));
  const pct = total ? Math.round(correctCount/total*100) : 0;
  el.textContent = 'クラウドに同期中...';
  fetch(GAS_URL, {
    method: 'POST', mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      user: currentUser, deck: currentDeck.name,
      correct: correctCount, total, pct, date: dateStr, words
    })
  }).then(() => { el.textContent = '✓ スプレッドシートに保存完了！'; })
    .catch(() => { el.textContent = 'クラウド保存に失敗しました'; });
}
</script>
